<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attendance Clicker</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation; /* Prevents double-tap zoom delay */
      overflow: hidden;
    }
    .header {
      padding: 20px;
      text-align: center;
    }
    #count {
      font-size: 7rem;
      font-weight: bold;
      color: #333;
      line-height: 1;
    }
    .label {
      font-size: 1.2rem;
      color: #666;
      margin-top: 5px;
    }
    .buttons {
      display: flex;
      width: 100%;
      height: 50vh;
      gap: 10px;
      padding: 10px;
      box-sizing: border-box;
    }
    button {
      flex: 1;
      font-size: 3rem;
      font-weight: bold;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      color: white;
      transition: transform 0.05s;
    }
    button:active { transform: scale(0.96); }
    #sub { background-color: #dc3545; }
    #add { background-color: #28a745; }
    
    .footer {
      padding-bottom: 20px;
    }
    #reset { 
      font-size: 1rem; 
      padding: 12px 30px; 
      background-color: #6c757d; 
      border-radius: 10px;
      border: none;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="label">Current Attendance</div>
    <div id="count">0</div>
  </div>

  <div class="buttons">
    <button id="sub" onclick="update(-1)">-</button>
    <button id="add" onclick="update(1)">+</button>
  </div>

  <div class="footer">
    <button id="reset" onclick="resetCount()">Reset</button>
  </div>

  <script>
    let count = parseInt(localStorage.getItem('attendanceCount')) || 0;
    const display = document.getElementById('count');
    display.innerText = count;

    function update(change) {
      count = Math.max(0, count + change);
      display.innerText = count;
      localStorage.setItem('attendanceCount', count);
    }

    function resetCount() {
      if (confirm("Reset attendance to 0?")) {
        count = 0;
        display.innerText = count;
        localStorage.setItem('attendanceCount', count);
      }
    }
  </script>

</body>
</html>
